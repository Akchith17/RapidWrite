<!DOCTYPE html>
<html>
<head>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RAPID WRITE - Stylus Handwriting Evaluator. Tablet-optimized calligraphy & kinematics handwriting assessment.">

  <!-- Viewport settings for smooth Apple Pencil drawing without pinch-zoom jitter -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS / iPadOS PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RAPID WRITE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RAPID WRITE - Stylus Handwriting Evaluator</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent default iOS rubber-band bounce, viewport scrolling, and touch delay */
    *, *::before, *::after {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #080B14;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      touch-action: none;
    }

    /* Lock Flutter canvas container */
    flt-glass-pane, flutter-view, canvas {
      touch-action: none !important;
      overscroll-behavior: none !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <script>
    // Bulletproof prevention of iPad Safari rubber-banding & pull-to-refresh
    document.addEventListener('touchmove', function (e) {
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    }, { passive: false });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
